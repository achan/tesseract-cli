id: signatures
repo: git@github.com:achan/signatures.git
main_path: /home/bot/repos/signatures
worktree_root: /home/bot/repos/signatures-worktrees
worktree_driver: git
default_branch: main
domain: signatures.achan.bot
base_port: 6200
port_count: 99
url_template: http://{domain}:{port}
processes:
  web: bin/dev
env_overrides:
  BINDING: 0.0.0.0
database: false
dns_records:
  - "{domain}"
